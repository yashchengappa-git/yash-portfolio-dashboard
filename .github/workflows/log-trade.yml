name: Log Trade

on:
  workflow_dispatch:
    inputs:
      date:
        required: true
      sym:
        required: true
      side:
        required: true
      amt:
        required: true

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install axios
      - name: Log trade
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: node scripts/log-trade.js "${{ github.event.inputs.date }}" "${{ github.event.inputs.sym }}" "${{ github.event.inputs.side }}" "${{ github.event.inputs.amt }}"
      - name: Commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Log trade: ${{ github.event.inputs.side }} ${{ github.event.inputs.sym }}"
          git push
